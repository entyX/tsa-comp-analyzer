<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Creek TSA Tiebreakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2eee3;
    --card: #fbf9f3;
    --ink: #141414;
    --ink-2: #4a4740;
    --ink-3: #8a8578;
    --rule: #d9d3c4;
    --signal: #ff4f00;
    --hilite: #ffe14d;
    --shadow: var(--ink);
    --card-h: 380px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121211;
      --card: #1b1a18;
      --ink: #efeadc;
      --ink-2: #bdb7a8;
      --ink-3: #7c776b;
      --rule: #34322d;
      --signal: #ff5a14;
      --hilite: #c9a800;
      --shadow: #ff5a14;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Archivo, system-ui, sans-serif; font-variation-settings: "wdth" 100;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Top bar ---------- */
  .topbar { border-bottom: 2px solid var(--ink); }
  .topbar .wrap { display: flex; justify-content: space-between; align-items: center; height: 44px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .live { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
  .blip { width: 9px; height: 9px; background: var(--signal); animation: blink 1.4s steps(2, start) infinite; }
  .blip.err { background: var(--ink-3); animation: none; }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- Masthead ---------- */
  .masthead { padding: 44px 0 28px; display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
  .kicker b { background: var(--ink); color: var(--paper); padding: 2px 6px; margin-right: 8px; }
  h1 {
    margin: 0; font-weight: 900; font-variation-settings: "wdth" 112;
    font-size: clamp(32px, 9vw, 112px); line-height: .86; letter-spacing: -.035em; text-transform: uppercase;
  }
  h1 span { color: var(--signal); }

  .scores { display: grid; grid-template-columns: repeat(3, auto); border: 2px solid var(--ink); background: var(--card); }
  .score { padding: 12px 22px 10px; border-left: 2px solid var(--ink); }
  .score:first-child { border-left: 0; }
  .score b { display: block; font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -.04em; }
  .score span { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }

  /* ---------- Controls ---------- */
  .controls {
    position: sticky; top: 0; z-index: 10; background: var(--paper);
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    display: flex; align-items: stretch; margin-bottom: 32px;
  }
  .search { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 16px; min-width: 0; }
  .search svg { flex-shrink: 0; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: 600 16px Archivo, sans-serif; padding: 16px 0;
  }
  .search input::placeholder { color: var(--ink-3); font-weight: 500; }
  .ctl {
    border: 0; border-left: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
    font: 700 12px "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; padding: 0 18px;
  }
  .ctl:hover { background: var(--ink); color: var(--paper); }
  .ctl.on { background: var(--ink); color: var(--paper); }
  .ctl.go { background: var(--signal); color: #fff; }
  .ctl.go:hover { filter: brightness(1.1); }
  .ctl.go.busy { opacity: .6; }

  .note { font: 600 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: -10px 0 18px; min-height: 14px; }

  /* ---------- Filters ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: -8px 0 24px; }
  .flt {
    display: inline-flex; align-items: stretch; border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    cursor: pointer; padding: 0; font: inherit; box-shadow: 3px 3px 0 var(--shadow); transition: transform .1s, box-shadow .1s;
  }
  .flt:not(.on):hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
  .flt span { padding: 8px 12px; font: 700 12px "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .flt small { font-weight: 600; color: var(--ink-3); letter-spacing: .02em; text-transform: none; }
  .flt b { border-left: 2px solid var(--ink); padding: 8px 10px; font: 800 13px "JetBrains Mono", monospace; min-width: 38px; text-align: center; }
  .flt.on { background: var(--ink); color: var(--paper); transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .flt.on small { color: var(--ink-3); }
  .flt.on b { border-color: var(--paper); }
  .flt[data-f="competitive"].on { background: var(--signal); border-color: var(--ink); color: #fff; }
  .flt[data-f="competitive"].on b { border-color: var(--ink); }
  .flt[data-f="competitive"].on small { color: #ffd9c7; }
  .lvl { width: 9px; height: 9px; border: 2px solid currentColor; flex-shrink: 0; }
  .lvl.c { background: var(--signal); border-color: var(--signal); }
  .lvl.m { background: currentColor; }

  /* ---------- Board ---------- */
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; padding-bottom: 64px; }
  .card {
    height: var(--card-h); display: flex; flex-direction: column;
    background: var(--card); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--shadow); }
  .card-title { cursor: pointer; }
  .card-title:hover h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .expand {
    border: 0; border-left: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
    width: 44px; display: grid; place-items: center; padding: 0;
  }
  .expand:hover { background: var(--ink); color: var(--paper); }
  .comp-tag { margin-left: 8px; color: var(--signal); font-weight: 800; }
  .comp-tag::before { content: "▲ "; font-size: .85em; }
  .card.over .tally { background: var(--signal); color: #fff; }
  .card.over .tally span { color: #fff; }

  .disclaimer {
    display: flex; gap: 14px; align-items: baseline; margin: -8px 0 24px; padding: 12px 16px;
    background: var(--card); border: 2px solid var(--ink); border-left: 8px solid var(--signal);
  }
  .disclaimer[hidden] { display: none; }
  .disclaimer b { font: 800 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); white-space: nowrap; }
  .disclaimer p { margin: 0; font-size: 14.5px; font-weight: 500; line-height: 1.45; }

  .card-head { display: grid; grid-template-columns: 1fr auto auto; border-bottom: 2px solid var(--ink); }
  .card-title { padding: 12px 14px 12px; min-width: 0; }
  .idx { font: 600 11px "JetBrains Mono", monospace; color: var(--ink-3); letter-spacing: .06em; }
  .card-title h2 {
    margin: 4px 0 0; font-size: 19px; line-height: 1.02; font-weight: 850; text-transform: uppercase;
    font-variation-settings: "wdth" 80; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tally {
    border-left: 2px solid var(--ink); padding: 8px 14px; min-width: 76px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .tally b { font: 800 30px/1 "JetBrains Mono", monospace; letter-spacing: -.05em; }
  .tally span { font: 700 9.5px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-top: 3px; }

  .teams { flex: 1; overflow-y: auto; min-height: 0; position: relative; scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
  .teams::-webkit-scrollbar { width: 6px; }
  .teams::-webkit-scrollbar-thumb { background: var(--ink); }
  .team { display: grid; grid-template-columns: 38px 1fr; border-bottom: 1px solid var(--rule); }
  .team:last-child { border-bottom: 0; }
  .tno {
    font: 800 13px "JetBrains Mono", monospace; color: var(--ink-3); padding: 12px 0 0 14px;
  }
  .team-body { padding: 11px 14px 12px 0; min-width: 0; }
  .tmeta { font: 600 10px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .fresh { background: var(--signal); color: #fff; padding: 1px 5px; font-style: normal; }
  body:has(dialog[open]) { overflow: hidden; }
  .names { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 14.5px; font-weight: 500; line-height: 1.35; }
  .names span { white-space: nowrap; }
  .names mark { background: var(--hilite); color: inherit; padding: 0 2px; box-decoration-break: clone; }

  .card-foot {
    border-top: 2px solid var(--ink); padding: 7px 14px; display: flex; justify-content: space-between;
    font: 600 10.5px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
  }
  .more { color: var(--signal); visibility: hidden; }
  .card.overflow .more { visibility: visible; }

  .msg { grid-column: 1 / -1; border: 2px dashed var(--ink-3); padding: 72px 20px; text-align: center; font: 600 13px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  .ghost { height: var(--card-h); border: 2px solid var(--rule); background: repeating-linear-gradient(-45deg, transparent 0 10px, var(--rule) 10px 11px); opacity: .6; }

  /* ---------- Modal ---------- */
  dialog.modal {
    width: min(1160px, calc(100vw - 48px)); height: min(860px, calc(100vh - 48px)); max-width: none; max-height: none;
    padding: 0; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    box-shadow: 10px 10px 0 var(--shadow); overflow: hidden;
  }
  dialog.modal[open] { display: flex; flex-direction: column; animation: pop .16s ease-out; }
  dialog.modal::backdrop { background: rgba(10,10,10,.55); backdrop-filter: grayscale(1); }
  @keyframes pop { from { transform: translate(10px, 10px); opacity: 0; } }
  .m-head { display: grid; grid-template-columns: 1fr auto; border-bottom: 2px solid var(--ink); background: var(--card); flex-shrink: 0; }
  .m-title { padding: 22px 26px 20px; min-width: 0; }
  .m-title .idx { font-size: 12px; }
  .m-title h2 {
    margin: 6px 0 0; font-weight: 900; text-transform: uppercase; font-variation-settings: "wdth" 90;
    font-size: clamp(28px, 4.4vw, 56px); line-height: .92; letter-spacing: -.025em;
  }
  .m-close {
    border: 0; border-left: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
    width: 72px; font: 400 34px/1 "JetBrains Mono", monospace;
  }
  .m-close:hover { background: var(--signal); color: #fff; }
  .m-stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 2px solid var(--ink); background: var(--card); flex-shrink: 0; }
  .m-stats div { padding: 12px 26px; border-left: 2px solid var(--ink); }
  .m-stats div:first-child { border-left: 0; }
  .m-stats b { display: block; font: 800 30px/1 "JetBrains Mono", monospace; letter-spacing: -.04em; }
  .m-stats span { font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .m-stats .c { background: var(--signal); color: #fff; }
  .m-stats .c span { color: #fff; }
  .m-alert { display: flex; gap: 14px; align-items: baseline; padding: 12px 26px; border-bottom: 2px solid var(--ink); flex-shrink: 0; }
  .m-alert b { font: 800 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
  .m-alert p { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; }
  .m-alert.over { background: var(--signal); color: #fff; }
  .m-alert.over b { color: #fff; }
  .m-body { flex: 1; overflow-y: auto; padding: 26px; scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
  .m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; align-items: start; }
  .m-team { background: var(--card); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); }
  .m-team header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--ink); padding: 10px 14px; }
  .m-team header b { font: 800 22px/1 "JetBrains Mono", monospace; letter-spacing: -.04em; }
  .m-team header span { font: 600 10.5px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .m-team ol { list-style: none; margin: 0; padding: 4px 0; counter-reset: m; }
  .m-team li { counter-increment: m; padding: 8px 14px; font-size: 16px; font-weight: 600; display: flex; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--rule); }
  .m-team li:last-child { border-bottom: 0; }
  .m-team li::before { content: counter(m); font: 600 11px "JetBrains Mono", monospace; color: var(--ink-3); width: 12px; }
  .m-team li mark { background: var(--hilite); color: inherit; padding: 0 2px; }

  @media (max-width: 760px) {
    dialog.modal { width: 100vw; height: 100dvh; border: 0; box-shadow: none; }
    .m-title { padding: 16px 18px; }
    .m-close { width: 60px; }
    .m-stats { grid-template-columns: repeat(2, 1fr); }
    .m-stats div { padding: 10px 18px; }
    .m-stats div:nth-child(3) { border-left: 0; }
    .m-stats div:nth-child(n+3) { border-top: 2px solid var(--ink); }
    .m-body { padding: 18px; }
    .m-alert { padding: 10px 18px; }
  }

  @media (max-width: 760px) {
    .masthead { grid-template-columns: 1fr; padding: 28px 0 22px; }
    .scores { grid-template-columns: repeat(3, 1fr); }
    .score { padding: 10px 12px 8px; }
    .score b { font-size: 28px; }
    .ctl { padding: 0 12px; }
    .ctl.sort-b { display: none; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 0 16px; }
    .board { grid-template-columns: 1fr; }
    .topbar .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <span class="live"><span class="blip" id="blip"></span><span id="status">Connecting</span></span>
    <span class="mono hide-sm" id="clock"></span>
  </div>
</div>

<div class="wrap">
  <header class="masthead">
    <div>
      <div class="kicker"><b>North Creek TSA</b>Live sign-up board</div>
      <h1>Tie<wbr>breakers<span>.</span></h1>
    </div>
    <div class="scores">
      <div class="score"><b id="sEvents">--</b><span>Events</span></div>
      <div class="score"><b id="sTeams">--</b><span>Teams</span></div>
      <div class="score"><b id="sPeople">--</b><span>Students</span></div>
    </div>
  </header>
</div>

<div class="controls">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
    <input id="q" type="search" placeholder="Find a student or event" autocomplete="off">
  </label>
  <button class="ctl sort-a on" data-sort="az" type="button">A–Z</button>
  <button class="ctl sort-b" data-sort="teams" type="button">Most teams</button>
  <button class="ctl go" id="refresh" type="button">Sync ↻</button>
</div>

<div class="wrap">
  <div class="filters" id="filters">
    <button class="flt on" data-f="all" type="button"><span>All events</span><b id="fAll">--</b></button>
    <button class="flt" data-f="competitive" type="button"><span><i class="lvl c"></i>Competitive <small>over state limit</small></span><b id="fCompetitive">--</b></button>
    <button class="flt" data-f="contested" type="button"><span><i class="lvl m"></i>Contested <small>within limit</small></span><b id="fContested">--</b></button>
    <button class="flt" data-f="uncontested" type="button"><span><i class="lvl"></i>Uncontested <small>1 team</small></span><b id="fUncontested">--</b></button>
  </div>
  <div class="disclaimer" id="disc" hidden>
    <b>Heads up</b>
    <p>These events have more teams signed up than the state limit allows per chapter. Teams in these events will have to compete at tiebreakers for a spot.</p>
  </div>
  <div class="note" id="note"></div>
  <main class="board" id="board">
    <div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>
  </main>
</div>

<dialog class="modal" id="modal" aria-labelledby="mTitle">
  <div class="m-head">
    <div class="m-title"><div class="idx" id="mIdx"></div><h2 id="mTitle"></h2></div>
    <button class="m-close" id="mClose" type="button" aria-label="Close">×</button>
  </div>
  <div class="m-stats" id="mStats"></div>
  <div class="m-alert" id="mAlert"></div>
  <div class="m-body"><div class="m-grid" id="mGrid"></div></div>
</dialog>

<script>
const SHEET_ID = '16X65GLzIA5s6ezHNIKV4trU3MqDy9xNts94ChPI_cTg';
const REFRESH_MS = 30_000;

const $ = id => document.getElementById(id);
let events = [];          // [{ name, teams: [{ members, key }] }]
let lastRaw = '';
let seenTeams = null;     // team keys from previous load, to mark new ones
let newTeams = new Set();
let lastSync = null;
let sortMode = 'az';
let filterMode = 'all';   // all | competitive | contested | uncontested
let openKey = null;       // event shown in the modal

// Second tab of the sheet: per-event state limits ("State Limit (per Chapter)")
const LIMITS_GID = '1819135025';
let limits = new Map();   // matchKey -> { limit, type, size }

// Competitive = more teams than the state limit (tiebreakers needed),
// uncontested = a single team, contested = everything in between.
const level = e => e.limit != null && e.teams.length > e.limit ? 'competitive'
  : e.teams.length === 1 ? 'uncontested' : 'contested';

// Loose name match so "Artificial Intelligence (AI)" == "Artificial Intelligence"
const matchKey = s => clean(s).toLowerCase().replace(/\(.*?\)/g, '').replace(/&/g, 'and').replace(/[^a-z0-9]/g, '');

function buildLimits(rows) {
  const header = rows[0].map(h => clean(h).toLowerCase());
  const col = re => header.findIndex(h => re.test(h));
  const ev = col(/^event/), lim = col(/limit/), type = col(/^type/), size = col(/members/);
  const map = new Map();
  for (const r of rows.slice(1)) {
    if (!clean(r[ev])) continue;
    const n = parseInt(r[lim], 10);
    map.set(matchKey(r[ev]), { limit: Number.isFinite(n) ? n : null, type: clean(r[type]), size: clean(r[size]) });
  }
  return map;
}

// Load the sheet via a <script> tag (JSONP) — not subject to CORS, so it works
// from a local file as well as any web host.
let reqId = 0;
function fetchSheet(gid) {
  return new Promise((resolve, reject) => {
    const cb = `__sheet_${++reqId}_${Date.now()}`;
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { done(); reject(new Error('timed out')); }, 15000);
    window[cb] = data => {
      done();
      if (data.status !== 'ok') return reject(new Error(data.errors?.[0]?.detailed_message || 'sheet error'));
      const t = data.table;
      resolve([
        t.cols.map(c => c.label || ''),
        ...t.rows.map(r => r.c.map(cell => cell == null ? '' : String(cell.f ?? cell.v ?? ''))),
      ]);
    };
    s.onerror = () => { done(); reject(new Error('network error — is the sheet shared publicly?')); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1${gid ? '&gid=' + gid : ''}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

const clean = s => (s || '').replace(/\s+/g, ' ').trim();
const norm = s => clean(s).toLowerCase();

function build(rows) {
  const header = rows[0].map(h => clean(h).toLowerCase());
  const evCol = header.findIndex(h => h.startsWith('event'));
  const memberCols = header.map((h, i) => /^member\s*\d+/.test(h) ? i : -1).filter(i => i >= 0);
  if (evCol < 0 || !memberCols.length) throw new Error('Unexpected sheet columns');

  const map = new Map();
  for (const r of rows.slice(1)) {
    const ev = clean(r[evCol]);
    if (!ev) continue;
    const members = memberCols.map(i => clean(r[i])).filter(Boolean);
    if (!members.length) continue;
    const evKey = norm(ev);
    if (!map.has(evKey)) map.set(evKey, { name: ev, key: evKey, teams: [], keys: new Set() });
    const e = map.get(evKey);
    // Skip duplicate submissions of the exact same team
    const key = evKey + '|' + members.map(norm).sort().join('|');
    if (e.keys.has(key)) continue;
    e.keys.add(key);
    e.teams.push({ members, key });
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

async function load(manual = false) {
  if (manual) { $('refresh').classList.add('busy'); $('status').textContent = 'Syncing'; }
  let rows, limitRows;
  try {
    // Limits tab failing shouldn't take the board down — keep the last known limits
    [rows, limitRows] = await Promise.all([fetchSheet(), fetchSheet(LIMITS_GID).catch(() => null)]);
  } catch (err) {
    $('blip').classList.add('err');
    $('status').textContent = 'Signal lost — retrying';
    if (!events.length) $('board').innerHTML = `<div class="msg">Couldn't load the sheet (${esc(err.message)})<br>Make sure it's shared as "Anyone with the link can view"</div>`;
    $('refresh').classList.remove('busy');
    return;
  }
  $('blip').classList.remove('err');
  $('refresh').classList.remove('busy');
  lastSync = new Date();

  const raw = JSON.stringify([rows, limitRows]);
  if (raw !== lastRaw) {
    lastRaw = raw;
    if (limitRows) limits = buildLimits(limitRows);
    events = build(rows);
    for (const e of events) {
      const info = limits.get(matchKey(e.name));
      e.limit = info?.limit ?? null;
      e.info = info || null;
    }
    const keys = new Set(events.flatMap(e => e.teams.map(t => t.key)));
    if (seenTeams) for (const k of keys) if (!seenTeams.has(k)) newTeams.add(k);
    seenTeams = keys;
    render();
  }
  updateStatus();
}

function updateStatus() {
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (!lastSync) return;
  const s = Math.round((Date.now() - lastSync) / 1000);
  $('status').textContent = `Live — synced ${s < 5 ? 'just now' : s < 60 ? s + 's ago' : Math.floor(s / 60) + 'm ago'}`;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

// Wrap the matching part of a name in <mark>
function markHit(name, q) {
  if (!q) return esc(name);
  const i = name.toLowerCase().indexOf(q);
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
}

function render() {
  const q = norm($('q').value);

  const people = new Set(events.flatMap(e => e.teams.flatMap(t => t.members.map(norm))));
  const teamCount = events.reduce((n, e) => n + e.teams.length, 0);
  $('sEvents').textContent = pad(events.length);
  $('sTeams').textContent = pad(teamCount);
  $('sPeople').textContent = pad(people.size);
  $('disc').hidden = filterMode !== 'competitive';

  const counts = { all: events.length, competitive: 0, contested: 0, uncontested: 0 };
  for (const e of events) counts[level(e)]++;
  for (const k in counts) $('f' + k[0].toUpperCase() + k.slice(1)).textContent = pad(counts[k]);

  let list = events.map((e, i) => {
    const idx = i + 1;
    if (filterMode !== 'all' && level(e) !== filterMode) return null;
    if (!q || norm(e.name).includes(q)) return { ...e, idx, shown: e.teams };
    const shown = e.teams.filter(t => t.members.some(m => norm(m).includes(q)));
    return shown.length ? { ...e, idx, shown } : null;
  }).filter(Boolean);

  if (sortMode === 'teams') list.sort((a, b) => b.teams.length - a.teams.length || a.name.localeCompare(b.name));

  const notes = [];
  if (filterMode !== 'all') notes.push(`Showing ${filterMode} events`);
  if (q) notes.push(`${list.length} event${list.length === 1 ? '' : 's'} match “${$('q').value.trim()}”`);
  $('note').textContent = notes.join(' · ');

  if (openKey) renderModal();

  if (!list.length) {
    $('board').innerHTML = `<div class="msg">${!events.length ? 'No teams signed up yet' : q ? 'Nothing matches that search' : `No ${filterMode} events right now`}</div>`;
    return;
  }

  $('board').innerHTML = list.map(e => {
    const students = new Set(e.teams.flatMap(t => t.members.map(norm))).size;
    const over = level(e) === 'competitive';
    return `
    <article class="card${over ? ' over' : ''}" data-key="${esc(e.key)}">
      <div class="card-head">
        <div class="card-title" data-open>
          <div class="idx">EVT/${pad(e.idx)}${over ? '<span class="comp-tag">Tiebreaker</span>' : ''}</div>
          <h2 title="${esc(e.name)}">${esc(e.name)}</h2>
        </div>
        <div class="tally" title="${e.limit != null ? `${e.teams.length} teams for ${e.limit} state spot${e.limit === 1 ? '' : 's'}` : 'No state limit listed'}"><b>${pad(e.teams.length)}</b><span>${e.limit != null ? `of ${e.limit} max` : e.teams.length === 1 ? 'Team' : 'Teams'}</span></div>
        <button class="expand" data-open type="button" aria-label="Expand ${esc(e.name)}" title="Expand">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        </button>
      </div>
      <div class="teams">
        ${e.shown.map(t => `
          <div class="team">
            <div class="tno">${pad(e.teams.indexOf(t) + 1)}</div>
            <div class="team-body">
              <div class="tmeta">${t.members.length === 1 ? 'Solo' : t.members.length + ' members'}${newTeams.has(t.key) ? '<span class="fresh">New</span>' : ''}</div>
              <div class="names">${t.members.map(m => `<span>${markHit(m, q)}</span>`).join('')}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="card-foot"><span>${students} student${students === 1 ? '' : 's'}</span><span class="more">Scroll ↓</span></div>
    </article>`;
  }).join('');

  // Flag cards whose team list doesn't fit, so the footer shows a scroll hint
  for (const card of $('board').querySelectorAll('.card')) {
    const t = card.querySelector('.teams');
    card.classList.toggle('overflow', t.scrollHeight > t.clientHeight + 2);
  }
}

// ---------- Expanded event modal ----------
function openModal(key) {
  openKey = key;
  renderModal();
  if (!$('modal').open) $('modal').showModal();
  $('modal').querySelector('.m-body').scrollTop = 0;
}

function renderModal() {
  const i = events.findIndex(e => e.key === openKey);
  if (i < 0) { $('modal').close(); return; }
  const e = events[i];
  const q = norm($('q').value);
  const students = new Set(e.teams.flatMap(t => t.members.map(norm))).size;
  const lv = level(e);
  const over = lv === 'competitive';
  const format = e.info ? [e.info.type, e.info.size && e.info.size + ' members'].filter(Boolean).join(' · ') : '';

  $('mIdx').innerHTML = `EVT/${pad(i + 1)}${format ? ' · ' + esc(format) : ''}${over ? '<span class="comp-tag">Tiebreaker</span>' : ''}`;
  $('mTitle').textContent = e.name;
  $('mStats').innerHTML = `
    <div class="${over ? 'c' : ''}"><b>${pad(e.teams.length)}</b><span>Teams signed up</span></div>
    <div><b>${e.limit != null ? pad(e.limit) : '—'}</b><span>State limit</span></div>
    <div><b>${pad(students)}</b><span>Students</span></div>
    <div><b>${lv === 'competitive' ? 'OVER' : lv === 'contested' ? 'OK' : 'SOLO'}</b><span>${lv}</span></div>`;
  const alert = over
    ? `<b>Tiebreakers</b><p>${e.teams.length} teams signed up for ${e.limit} state spot${e.limit === 1 ? '' : 's'}. These teams will have to compete at tiebreakers.</p>`
    : e.limit == null
    ? `<b>No limit</b><p>No state limit is listed for this event in the sheet.</p>`
    : lv === 'uncontested'
    ? `<b>Uncontested</b><p>Only one team has signed up, so no tiebreaker is needed.</p>`
    : `<b>Within limit</b><p>${e.teams.length} of ${e.limit} state spots filled, so no tiebreaker is needed.</p>`;
  $('mAlert').className = 'm-alert' + (over ? ' over' : '');
  $('mAlert').innerHTML = alert;
  $('mGrid').innerHTML = e.teams.map((t, n) => `
    <section class="m-team">
      <header><b>T${pad(n + 1)}</b><span>${newTeams.has(t.key) ? '<i class="fresh">New</i>' : ''}${t.members.length === 1 ? 'Solo' : t.members.length + ' members'}</span></header>
      <ol>${t.members.map(m => `<li>${markHit(m, q)}</li>`).join('')}</ol>
    </section>`).join('');
}

$('board').addEventListener('click', ev => {
  if (!ev.target.closest('[data-open]')) return;
  openModal(ev.target.closest('.card').dataset.key);
});
$('mClose').addEventListener('click', () => $('modal').close());
$('modal').addEventListener('click', ev => { if (ev.target === $('modal')) $('modal').close(); });
$('modal').addEventListener('close', () => { openKey = null; });

for (const b of document.querySelectorAll('[data-f]')) {
  b.addEventListener('click', () => {
    filterMode = b.dataset.f;
    for (const x of document.querySelectorAll('[data-f]')) x.classList.toggle('on', x === b);
    render();
  });
}

$('q').addEventListener('input', render);
for (const b of document.querySelectorAll('[data-sort]')) {
  b.addEventListener('click', () => {
    sortMode = b.dataset.sort;
    for (const x of document.querySelectorAll('[data-sort]')) x.classList.toggle('on', x === b);
    render();
  });
}
$('refresh').addEventListener('click', () => load(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
window.addEventListener('resize', () => { if (events.length) render(); });
document.fonts?.ready.then(() => { if (events.length) render(); });

load();
setInterval(load, REFRESH_MS);
setInterval(updateStatus, 1000);
</script>
</body>
</html>
